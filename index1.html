<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>แดชบอร์ดผลการสอบ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient(
      'https://wzwyotzzxycqfwercakh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno'
    );

    // 📌 วางข้อความคำถามอัตนัยภาษาไทยจริงของคุณตามลำดับตรงนี้ได้เลยครับ
    const QUESTIONS_LIST = [
      "คำถามอัตนัยข้อที่ 1 (ไม่สนใจประกันครับ/ค่ะ)",
      "คำถามอัตนัยข้อที่ 2 (มีประกันอยู่แล้วหลายตัว?)",
      "คำถามอัตนัยข้อที่ 3 (ไม่อยากเพิ่มภาระประกันอีก?)",
      "คำถามอัตนัยข้อที่ 4 (ไม่อยากซ้ำซ้อนกับของเดิม?)",
      "คำถามอัตนัยข้อที่ 5 (ตอนนี้ไม่สะดวกคุยครับ/ค่ะ)"
      "คำถามอัตนัยข้อที่ 6 (มีเอกสารส่งให้ดูก่อนไหม?)",
      "คำถามอัตนัยข้อที่ 7 (ขอปรึกษาที่บ้านก่อน?)",
      "คำถามอัตนัยข้อที่ 8 (ยังไม่ตัดสินใจครับ?)",
      "คำถามอัตนัยข้อที่ 9 (เบี้ยแพงไปไม่มีเงินจ่าย?)",
      "คำถามอัตนัยข้อที่ 10 (ทำแล้วยกเลิกได้ไหม?)"
    ];

    async function fetchData() {
      const email = document.getElementById("emailInput").value.trim();
      const date = document.getElementById("dateInput").value.trim();

      const { data: quizResults } = await supabase.from("quiz_results").select("*");
      const { data: subjectiveAnswers } = await supabase.from("subjective_answers").select("*");

      const filteredQuiz = (quizResults || []).filter(r =>
        (!email || (r.user_email && r.user_email.includes(email))) &&
        (!date || (r.created_at && r.created_at.startsWith(date)))
      );
      const filteredSubjective = (subjectiveAnswers || []).filter(r =>
        (!email || (r.user_email && r.user_email.includes(email))) &&
        (!date || (r.created_at && r.created_at.startsWith(date)))
      );

      renderTables(filteredQuiz, filteredSubjective);
      renderChart(filteredQuiz);
    }

    function renderTables(quizData, subjectiveData) {
      const quizTable = document.getElementById("quizTableBody");
      const subjectiveTable = document.getElementById("subjectiveTableBody");
      quizTable.innerHTML = "";
      subjectiveTable.innerHTML = "";

      // 1. ตารางปรนัย
      quizData.forEach((r, i) => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${i + 1}</td><td>${r.name || 'N/A'}</td><td>${r.user_email}</td><td>${r.score}</td><td>${r.total_questions}</td><td>${r.created_at}</td>`;
        quizTable.appendChild(row);
      });

      // 2. ตารางอัตนัย (เปลี่ยนจาก JSON.stringify เป็น formatAnswersHTML)
      subjectiveData.forEach((r, i) => {
        const row = document.createElement("tr");
        const formattedAnswers = formatAnswersHTML(r.answers);
        row.innerHTML = `<td>${i + 1}</td><td>${r.name || 'N/A'}</td><td>${r.user_email}</td><td>${formattedAnswers}</td><td>${r.created_at}</td>`;
        subjectiveTable.appendChild(row);
      });
    }

    function formatAnswersHTML(answers) {
      if (!answers) return "<span style='color:#888;'>ไม่มีข้อมูลคำตอบ</span>";

      let entries = [];

      if (Array.isArray(answers)) {
        entries = answers.map((item, idx) => {
          if (typeof item === 'object' && item !== null) {
            return {
              key: item.q || item.question_id || item.key || `q${idx + 1}`,
              val: item.answer || item.a || item.value || JSON.stringify(item)
            };
          }
          return { key: `q${idx + 1}`, val: item };
        });
      } else if (typeof answers === 'object' && answers !== null) {
        entries = Object.entries(answers).map(([k, v]) => ({
          key: k,
          val: (typeof v === 'object' && v !== null) ? JSON.stringify(v) : v
        }));
      } else {
        return `<div style="padding:4px;"><strong>คำตอบ:</strong> ${answers}</div>`;
      }

      if (entries.length === 0) return "<span style='color:#888;'>ไม่มีรายการคำตอบ</span>";

      return entries.map((item, idx) => {
        const fullQuestion = QUESTIONS_LIST[idx] || `คำถามข้อที่ ${idx + 1} (${item.key})`;

        return `
          <div style="background:#f8fafc; border-left:3px solid #007acc; padding:6px 10px; margin-bottom:6px; border-radius:0 4px 4px 0; font-size:0.9rem;">
            <div style="color:#0f172a; margin-bottom:2px;"><strong>ข้อที่ ${idx + 1}: ${fullQuestion}</strong></div>
            <div style="color:#334155;"><strong>คำตอบ:</strong> ${item.val || '-'}</div>
          </div>
        `;
      }).join("");
    }

    function renderChart(data) {
      const ctx = document.getElementById("scoreChart").getContext("2d");
      const labels = data.map(r => r.user_email);
      const scores = data.map(r => r.score);
      if (window.scoreChartInstance) window.scoreChartInstance.destroy();
      window.scoreChartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [{
            label: "คะแนนรวม",
            data: scores,
            backgroundColor: "rgba(0, 122, 204, 0.6)"
          }]
        },
        options: {
          animation: {
            duration: 1000,
            easing: "easeOutBounce"
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

    function downloadExcel() {
      const wb = XLSX.utils.book_new();
      const quizTable = XLSX.utils.table_to_sheet(document.getElementById("quizTable"));
      const subjectiveTable = XLSX.utils.table_to_sheet(document.getElementById("subjectiveTable"));
      XLSX.utils.book_append_sheet(wb, quizTable, "ปรนัย");
      XLSX.utils.book_append_sheet(wb, subjectiveTable, "อัตนัย");
      XLSX.writeFile(wb, "ผลการสอบ.xlsx");
    }

    function downloadPDF() {
      const element = document.getElementById("dashboard");
      html2pdf().from(element).save("ผลการสอบ.pdf");
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("searchBtn").addEventListener("click", fetchData);
      document.getElementById("downloadExcelBtn").addEventListener("click", downloadExcel);
      document.getElementById("downloadPDFBtn").addEventListener("click", downloadPDF);
      fetchData();
    });
  </script>
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #007acc;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    input, button {
      padding: 10px;
      font-size: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #007acc;
      color: white;
    }
    canvas {
      max-width: 100%;
      margin-bottom: 30px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div id="dashboard">
    <h2>แดชบอร์ดผลการสอบ</h2>
    <div class="search-box">
      <input type="text" id="emailInput" placeholder="ค้นหาอีเมลพนักงาน">
      <input type="date" id="dateInput">
      <button id="searchBtn">ค้นหา</button>
    </div>
    <div class="btn-group">
      <button id="downloadExcelBtn">ดาวน์โหลด Excel</button>
      <button id="downloadPDFBtn">ดาวน์โหลด PDF</button>
    </div>
    <canvas id="scoreChart" height="100"></canvas>
    
    <h3>ตารางสรุปคะแนน (ข้อสอบปรนัย)</h3>
    <table id="quizTable">
      <thead>
        <tr><th>#</th><th>ชื่อผู้ทำแบบทดสอบ</th><th>อีเมล</th><th>คะแนน</th><th>จำนวนข้อ</th><th>วันที่ทำแบบทดสอบ</th></tr>
      </thead>
      <tbody id="quizTableBody"></tbody>
    </table>

    <h3>ตารางคำตอบ (ข้อสอบอัตนัย)</h3>
    <table id="subjectiveTable">
      <thead>
        <tr><th style="width: 5%;">#</th><th style="width: 20%;">ชื่อผู้ทำแบบทดสอบ</th><th style="width: 20%;">อีเมล</th><th style="width: 40%;">คำถาม & คำตอบ</th><th style="width: 15%;">วันที่ทำแบบทดสอบ</th></tr>
      </thead>
      <tbody id="subjectiveTableBody"></tbody>
    </table>
  </div>
</body>
</html>
