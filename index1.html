<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>แดชบอร์ดสรุปผลการประเมินรอบด้าน (11 ชุด + อัตนัย)</title>
  
  <!-- Fonts & Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // 📌 Supabase Configuration
    const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const QUESTIONS_LIST = [
      "คำถามอัตนัยข้อที่ 1 (ไม่สนใจประกันครับ/ค่ะ)",
      "คำถามอัตนัยข้อที่ 2 (มีประกันอยู่แล้วหลายตัว?)",
      "คำถามอัตนัยข้อที่ 3 (ไม่อยากเพิ่มภาระประกันอีก?)",
      "คำถามอัตนัยข้อที่ 4 (ไม่อยากซ้ำซ้อนกับของเดิม?)",
      "คำถามอัตนัยข้อที่ 5 (ตอนนี้ไม่สะดวกคุยครับ/ค่ะ)",
      "คำถามอัตนัยข้อที่ 6 (มีเอกสารส่งให้ดูก่อนไหม?)",
      "คำถามอัตนัยข้อที่ 7 (ขอปรึกษาที่บ้านก่อน?)",
      "คำถามอัตนัยข้อที่ 8 (ยังไม่ตัดสินใจครับ?)",
      "คำถามอัตนัยข้อที่ 9 (เบี้ยแพงไปไม่มีเงินจ่าย?)",
      "คำถามอัตนัยข้อที่ 10 (ทำแล้วยกเลิกได้ไหม?)"
    ];

    let globalCandidateMap = {};

    // 📌 ดึงข้อมูลจาก Supabase ทั้ง quiz_results และ subjective_answers
    async function fetchData() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const date = document.getElementById("dateInput").value.trim();

      try {
        const { data: users } = await supabase.from("users").select("*");
        const { data: quizResults } = await supabase.from("quiz_results").select("*").order('created_at', { ascending: false });
        const { data: subjectiveAnswers } = await supabase.from("subjective_answers").select("*").order('created_at', { ascending: false });

        const userMap = {};
        (users || []).forEach(u => {
          if (u.email) userMap[u.email.toLowerCase().trim()] = u;
        });

        // ฟังก์ชันจัดระเบียบข้อมูลผู้ใช้กลาง
        const resolveUser = (r) => {
          const emailKey = (r.user_email || r.email || '').toLowerCase().trim();
          const matchedUser = userMap[emailKey];

          let finalName = 'ไม่ระบุชื่อ';
          if (r.name && r.name !== 'EMPTY' && r.name.trim() !== '') {
            finalName = r.name;
          } else if (matchedUser && matchedUser.full_name) {
            finalName = matchedUser.full_name;
          } else if (emailKey) {
            finalName = emailKey;
          }

          let finalExp = 'ไม่ระบุ';
          if (r.experience !== null && r.experience !== undefined && r.experience !== '') {
            finalExp = String(r.experience);
          } else if (matchedUser && matchedUser.experience) {
            finalExp = String(matchedUser.experience);
          }

          return { name: finalName, experience: finalExp, email: emailKey || 'N/A' };
        };

        // รวบรวมข้อมูลทั้งหมดผูกเข้ากับรายชื่อพนักงาน
        globalCandidateMap = {};

        // 1. ประมวลผลข้อสอบปรนัย (11 ชุด)
        (quizResults || []).forEach(r => {
          const userInfo = resolveUser(r);
          const key = userInfo.name;

          if (!globalCandidateMap[key]) {
            globalCandidateMap[key] = {
              name: userInfo.name,
              experience: userInfo.experience,
              email: userInfo.email,
              quizScores: {},
              subjectiveTests: []
            };
          }

          const modName = r.quiz_set || "แบบทดสอบทั่วไป";
          const totalQ = r.total_questions || 10;
          const pct = Math.round(((r.score || 0) / totalQ) * 100);

          globalCandidateMap[key].quizScores[modName] = {
            score: r.score,
            total: totalQ,
            pct: pct,
            passed: pct >= 80,
            date: r.created_at
          };
        });

        // 2. ประมวลผลข้อสอบอัตนัย (Pre-test / Post-test / สถานการณ์จำลอง)
        (subjectiveAnswers || []).forEach(r => {
          const userInfo = resolveUser(r);
          const key = userInfo.name;

          if (!globalCandidateMap[key]) {
            globalCandidateMap[key] = {
              name: userInfo.name,
              experience: userInfo.experience,
              email: userInfo.email,
              quizScores: {},
              subjectiveTests: []
            };
          }

          globalCandidateMap[key].subjectiveTests.push({
            answers: r.answers,
            ai_analysis: r.ai_analysis,
            date: r.created_at
          });
        });

        // กรองข้อมูลตาม Keyword และ Date
        let candidatesArray = Object.values(globalCandidateMap);
        if (keyword) {
          candidatesArray = candidatesArray.filter(c => 
            c.name.toLowerCase().includes(keyword) || 
            c.email.toLowerCase().includes(keyword) || 
            c.experience.toLowerCase().includes(keyword)
          );
        }

        renderSummaryStats(candidatesArray);
        renderMatrixTable(candidatesArray);
        renderChart(candidatesArray);

      } catch (err) {
        console.error("Fetch Data Error:", err);
      }
    }

    function renderSummaryStats(candidates) {
      document.getElementById("totalCandidates").innerText = candidates.length;
      
      let totalQuizzesCount = 0;
      let totalSubjectiveCount = 0;
      let sumPct = 0;
      let quizCountForAvg = 0;

      candidates.forEach(c => {
        const qLen = Object.keys(c.quizScores).length;
        totalQuizzesCount += qLen;
        totalSubjectiveCount += c.subjectiveTests.length;

        Object.values(c.quizScores).forEach(q => {
          sumPct += q.pct;
          quizCountForAvg++;
        });
      });

      document.getElementById("totalQuizzes").innerText = totalQuizzesCount;
      document.getElementById("totalSubjective").innerText = totalSubjectiveCount;
      document.getElementById("avgScore").innerText = quizCountForAvg > 0 ? (sumPct / quizCountForAvg).toFixed(1) + "%" : "0%";
    }

    // 📌 แสดงตารางภาพรวมรายบุคคล
    function renderMatrixTable(candidates) {
      const tableBody = document.getElementById("matrixTableBody");
      tableBody.innerHTML = "";

      if (candidates.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">ไม่พบข้อมูลพนักงาน</td></tr>`;
        return;
      }

      candidates.forEach((c, i) => {
        const row = document.createElement("tr");
        const quizPassed = Object.values(c.quizScores).filter(q => q.passed).length;
        const quizTotal = Object.keys(c.quizScores).length;
        const subjTotal = c.subjectiveTests.length;

        row.innerHTML = `
          <td>${i + 1}</td>
          <td><strong>${c.name}</strong><br><small style="color:#64748b;">${c.email}</small></td>
          <td><span class="badge-exp">${c.experience}</span></td>
          <td><span class="badge-score" style="background:#e0f2fe; color:#0369a1;">ทำแล้ว ${quizTotal} ชุด (ผ่าน ${quizPassed})</span></td>
          <td><span class="badge-score" style="background:#f3e8ff; color:#6b21a8;">ส่งแล้ว ${subjTotal} ชุด</span></td>
          <td>
            <button class="btn-action" onclick='openCandidateReport(${JSON.stringify(c)})'>🔍 ดูรายงานฉบับเต็ม</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // 📌 เปิดรายงานฉบับเต็มรายบุคคล (รวมทั้ง 11 ชุดปรนัย + อัตนัย)
    window.openCandidateReport = function(c) {
      const modalContent = document.getElementById("modalReportContent");

      // สร้างตารางสรุปปรนัย 11 ชุด
      let quizRows = "";
      if (Object.keys(c.quizScores).length === 0) {
        quizRows = `<tr><td colspan="4" style="text-align:center; color:#888;">ยังไม่มีประวัติการทำแบบทดสอบปรนัย</td></tr>`;
      } else {
        for (const [modName, data] of Object.entries(c.quizScores)) {
          const badge = data.passed 
            ? `<span style="color:#005900; background:#d1ffd1; padding:2px 6px; border-radius:4px; font-weight:bold;">ผ่าน (>=80%)</span>`
            : `<span style="color:#900; background:#ffd1d1; padding:2px 6px; border-radius:4px; font-weight:bold;">ไม่ผ่าน</span>`;
          quizRows += `
            <tr>
              <td style="padding:8px; border-bottom:1px solid #eee;">${modName}</td>
              <td style="padding:8px; border-bottom:1px solid #eee; text-align:center;">${data.score} / ${data.total}</td>
              <td style="padding:8px; border-bottom:1px solid #eee; text-align:center;"><strong>${data.pct}%</strong></td>
              <td style="padding:8px; border-bottom:1px solid #eee; text-align:center;">${badge}</td>
            </tr>
          `;
        }
      }

      // สร้างรายละเอียดข้อสอบอัตนัย (Pre/Post Test)
      let subjectiveHTML = "";
      if (c.subjectiveTests.length === 0) {
        subjectiveHTML = `<p style="color:#888; font-style:italic;">ยังไม่มีประวัติการทำข้อสอบอัตนัย</p>`;
      } else {
        c.subjectiveTests.forEach((sub, idx) => {
          let ansList = "";
          const answers = sub.answers;
          if (Array.isArray(answers)) {
            ansList = answers.map((ansItem, qIdx) => {
              const qText = QUESTIONS_LIST[qIdx] || `คำถามข้อที่ ${qIdx + 1}`;
              const val = (typeof ansItem === 'object' && ansItem !== null) ? (ansItem.answer || ansItem.value || JSON.stringify(ansItem)) : ansItem;
              return `<div style="margin-bottom:6px; font-size:0.9rem;"><strong style="color:#007acc;">${qText}</strong><br><span style="color:#333;">ตอบ: ${val || '-'}</span></div>`;
            }).join("");
          }

          subjectiveHTML += `
            <div style="background:#f8fafc; border:1px solid #cbd5e1; padding:12px; border-radius:6px; margin-bottom:10px;">
              <p style="margin:0 0 8px 0; font-size:0.85rem; color:#64748b;">ครั้งที่ส่ง: ${new Date(sub.date).toLocaleString('th-TH')}</p>
              ${ansList}
            </div>
          `;
        });
      }

      modalContent.innerHTML = `
        <div style="background:#ffffff; padding:20px; color:#333; font-family:'Sarabun', sans-serif;" id="printableCard">
          <div style="border-bottom: 2px solid #007acc; padding-bottom: 10px; margin-bottom: 20px;">
            <h2 style="color:#007acc; margin:0; font-size:20px;">📊 รายงานผลการประเมินรอบด้าน (Final Day Comprehensive Report)</h2>
            <p style="margin:5px 0 0 0; color:#64748b; font-size:13px;">วันที่ออกรายงาน: ${new Date().toLocaleDateString('th-TH')}</p>
          </div>

          <div style="background:#f8fafc; padding:12px; border-radius:6px; margin-bottom:15px; border:1px solid #e2e8f0;">
            <p style="margin:3px 0;"><strong>ชื่อ-นามสกุล:</strong> ${c.name}</p>
            <p style="margin:3px 0;"><strong>อีเมล:</strong> ${c.email}</p>
            <p style="margin:3px 0;"><strong>ประสบการณ์:</strong> <span class="badge-exp">${c.experience}</span></p>
          </div>

          <h3 style="color:#2c3e50; font-size:15px; margin-top:15px;">📋 ผลคะแนนแบบทดสอบปรนัย (รายชุดหลักสูตร)</h3>
          <table style="width:100%; border-collapse:collapse; margin-bottom:15px; font-size:0.9rem;">
            <thead>
              <tr style="background:#007acc; color:white;">
                <th style="padding:8px; text-align:left;">ชื่อชุดแบบทดสอบ</th>
                <th style="padding:8px; text-align:center;">คะแนน</th>
                <th style="padding:8px; text-align:center;">ร้อยละ</th>
                <th style="padding:8px; text-align:center;">สถานะ</th>
              </tr>
            </thead>
            <tbody>${quizRows}</tbody>
          </table>

          <h3 style="color:#2c3e50; font-size:15px; margin-top:15px;">✍️ รายละเอียดข้อสอบอัตนัย / Pre-Post Test</h3>
          ${subjectiveHTML}
        </div>
      `;

      document.getElementById("individualModal").style.display = "block";
      document.getElementById("downloadIndividualPDFBtn").onclick = function() {
        downloadPDFReport(c.name);
      };
    };

    window.closeModal = function() {
      document.getElementById("individualModal").style.display = "none";
    };

    function downloadPDFReport(name) {
      const element = document.getElementById("printableCard");
      const opt = {
        margin: [0.3, 0.3, 0.3, 0.3],
        filename: `รายงานรอบด้าน_${name}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function renderChart(candidates) {
      const ctx = document.getElementById("scoreChart").getContext("2d");
      const moduleSummary = {};

      candidates.forEach(c => {
        for (const [modName, data] of Object.entries(c.quizScores)) {
          if (!moduleSummary[modName]) moduleSummary[modName] = { sum: 0, count: 0 };
          moduleSummary[modName].sum += data.pct;
          moduleSummary[modName].count += 1;
        }
      });

      const labels = Object.keys(moduleSummary);
      const averages = labels.map(l => (moduleSummary[l].sum / moduleSummary[l].count).toFixed(1));

      if (window.scoreChartInstance) window.scoreChartInstance.destroy();

      window.scoreChartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels: labels.map(l => l.replace("แบบทดสอบปรนัย: ", "")),
          datasets: [{
            label: "คะแนนเฉลี่ยรวมภาพรวม (%)",
            data: averages,
            backgroundColor: "rgba(0, 122, 204, 0.75)",
            borderColor: "rgba(0, 122, 204, 1)",
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { font: { family: 'Sarabun' } } } },
          scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
        }
      });
    }

    function downloadExcel() {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.table_to_sheet(document.getElementById("matrixTable"));
      XLSX.utils.book_append_sheet(wb, ws, "สรุปผลภาพรวม");
      XLSX.writeFile(wb, "Comprehensive_Evaluation.xlsx");
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("searchBtn").addEventListener("click", fetchData);
      document.getElementById("downloadExcelBtn").addEventListener("click", downloadExcel);
      fetchData();
    });
  </script>

  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f9; color: #333; margin: 0; padding: 30px 15px; }
    #dashboard { max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #007acc; font-weight: 700; margin-top: 0; margin-bottom: 25px; }
    h3 { color: #2c3e50; font-size: 1.15rem; margin-top: 30px; margin-bottom: 15px; border-left: 4px solid #007acc; padding-left: 10px; }
    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .kpi-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; text-align: center; }
    .kpi-card .number { font-size: 1.8rem; font-weight: 700; color: #007acc; }
    .kpi-card .label { font-size: 0.85rem; color: #64748b; }
    .search-box { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
    input, button { padding: 10px 16px; font-size: 0.95rem; font-family: 'Sarabun', sans-serif; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; }
    input:focus { border-color: #007acc; box-shadow: 0 0 0 3px rgba(0, 122, 204, 0.15); }
    button { background: #007acc; color: white; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: #005999; }
    .btn-group { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 20px; }
    .btn-secondary { background: #22c55e; } .btn-secondary:hover { background: #16a34a; }
    .btn-danger { background: #ef4444; } .btn-danger:hover { background: #dc2626; }
    .btn-action { background: #0284c7; color: white; border: none; padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }
    .btn-action:hover { background: #0369a1; }
    .chart-container { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 25px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 25px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; vertical-align: middle; }
    th { background: #007acc; color: white; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #f8fafc; }
    .badge-score { background-color: #e0f2fe; color: #0369a1; font-weight: bold; padding: 3px 8px; border-radius: 12px; display: inline-block; }
    .badge-exp { background-color: #f1f5f9; color: #475569; font-weight: 600; padding: 3px 8px; border-radius: 6px; border: 1px solid #cbd5e1; display: inline-block; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); overflow-y: auto; }
    .modal-content { background-color: #fff; margin: 40px auto; padding: 30px; border-radius: 12px; max-width: 900px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; }
    .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; font-weight: bold; color: #aaa; cursor: pointer; }
    .close-btn:hover { color: #333; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div id="dashboard">
    <h2>🎯 แดชบอร์ดสรุปผลการประเมินรอบด้าน (ปรนัย 11 ชุด + อัตนัย)</h2>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ค้นหาด้วยชื่อพนักงาน หรือ อีเมล">
      <input type="date" id="dateInput">
      <button id="searchBtn">ค้นหาข้อมูล</button>
    </div>

    <div class="btn-group">
      <button id="downloadExcelBtn" class="btn-secondary">📥 ดาวน์โหลด Excel สรุปภาพรวม</button>
    </div>

    <div class="kpi-container">
      <div class="kpi-card">
        <div class="number" id="totalCandidates">0</div>
        <div class="label">จำนวนพนักงานทั้งหมด</div>
      </div>
      <div class="kpi-card">
        <div class="number" id="totalQuizzes">0</div>
        <div class="label">ชุดปรนัยที่ทำรวม</div>
      </div>
      <div class="kpi-card">
        <div class="number" id="totalSubjective">0</div>
        <div class="label">ชุดอัตนัยที่ส่งรวม</div>
      </div>
      <div class="kpi-card">
        <div class="number" id="avgScore">0%</div>
        <div class="label">คะแนนเฉลี่ยรวม</div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="scoreChart" height="90"></canvas>
    </div>

    <h3>📋 ตารางสรุปผลการประเมินรายบุคคล (ปรนัยและอัตนัย)</h3>
    <table id="matrixTable">
      <thead>
        <tr>
          <th>#</th>
          <th>ชื่อพนักงาน / อีเมล</th>
          <th>ประสบการณ์</th>
          <th>ผลงานปรนัย</th>
          <th>ผลงานอัตนัย</th>
          <th>จัดการ / ดูรายงานฉบับเต็ม</th>
        </tr>
      </thead>
      <tbody id="matrixTableBody"></tbody>
    </table>
  </div>

  <!-- Modal รายงานรายบุคคล -->
